<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Corredores - Falange</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <a href="dashboard.html" class="back-btn">← Voltar</a>
      <h1 id="tituloPagina">Corredores</h1>
    </header>

    <!-- Barra de Pesquisa -->
    <div id="searchBox" class="search-box">
      <input type="text" id="searchInput" placeholder="🔍 Número do corredor ou nome da mercadoria..." autocomplete="off">
      <button id="searchBtn">Buscar</button>
    </div>

    <!-- Resultados da pesquisa -->
    <div id="searchResults" class="search-results hidden"></div>

    <!-- Lista de Corredores -->
    <div id="secaoCorredores">
      <button id="btnExportar" class="btn-exportar">📄 Exportar PDF</button>
      <div id="corredoresGrupos"></div>
    </div>

    <!-- Lista de Mercadorias -->
    <div id="secaoMercadorias" class="hidden">
      <button id="btnAdicionar" class="btn-primary">➕ Adicionar mercadoria</button>

      <div id="formBox" class="form-box hidden">
        <h3 id="formTitle">Nova mercadoria</h3>
       <input type="text" id="inputNome" placeholder="Nome da mercadoria" maxlength="80">
<input type="text" id="inputValidade" placeholder="Validade (opcional) - ex: 15/08/2026">
<input type="number" id="inputQtd" placeholder="Quantidade de paletes" min="1" value="1">
        <div class="form-actions">
          <button id="btnSalvar" class="btn-primary">Aceitar</button>
          <button id="btnCancelar" class="btn-secondary">Cancelar</button>
        </div>
      </div>

      <div id="listaMercadorias" class="lista-mercadorias"></div>
      <p id="msgVazio" class="msg-vazio hidden">Nenhuma mercadoria neste corredor.</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script src="script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      initCorredorPage();
    });
  </script>
</body>
</html>
