<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Corredores - Falange</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <a href="dashboard.html" class="back-btn">← Voltar</a>
      <h1 id="tituloPagina">Corredores</h1>
    </header>

    <div id="searchBox" class="search-box">
      <input type="search" id="searchInput" placeholder="🔍 Número do corredor ou nome da mercadoria..." autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" name="falange-busca" inputmode="search">
      <button id="searchBtn" type="button">Buscar</button>
    </div>

    <div id="searchResults" class="search-results hidden"></div>

    <div id="secaoCorredores">
      <button id="btnExportar" class="btn-exportar" type="button">📄 Exportar PDF</button>
      <div id="corredoresGrupos"></div>
    </div>

    <div id="secaoMercadorias" class="hidden">
      <button id="btnAdicionar" class="btn-primary" type="button">➕ Adicionar mercadoria</button>

      <div id="formBox" class="form-box hidden">
        <h3 id="formTitle">Nova mercadoria</h3>
        <form autocomplete="off" onsubmit="return false;">
          <input type="text" id="inputNome" placeholder="Nome da mercadoria" maxlength="80" autocomplete="off" name="falange-nome" autocapitalize="off">
          <input type="text" id="inputValidade" placeholder="Vencimento do pallet (opcional) - ex: 15/08/2026" autocomplete="new-password" name="falange-vencimento" autocapitalize="off" inputmode="text">
          <input type="number" id="inputQtd" placeholder="Quantidade de paletes" min="1" value="1" autocomplete="off" name="falange-qtd" inputmode="numeric">
        </form>
        <div class="form-actions">
          <button id="btnSalvar" class="btn-primary" type="button">Aceitar</button>
          <button id="btnCancelar" class="btn-secondary" type="button">Cancelar</button>
        </div>
      </div>

      <div id="listaMercadorias" class="lista-mercadorias"></div>
      <p id="msgVazio" class="msg-vazio hidden">Nenhuma mercadoria neste corredor.</p>
    </div>

    <p class="credito">Criado por Gabryel Canário</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script src="script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      initCorredorPage();
    });
  </script>
</body>
</html>
