<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Falange - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📦 FALANGE</h1>
      <p class="subtitle">Controle de Paletes</p>
    </header>

    <div class="auth-box">
      <h2 id="authTitle">Entrar</h2>

      <input type="email" id="email" placeholder="Seu e-mail" autocomplete="email">
      <input type="password" id="password" placeholder="Sua senha" autocomplete="current-password">

      <button id="btnAuth" class="btn-primary">Entrar</button>
      <button id="btnToggle" class="btn-secondary">Criar uma conta</button>

      <p id="authMessage" class="auth-message"></p>
    </div>

    <p class="credito">Criado por Gabryel Canário</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      initAuthPage();
    });
  </script>
</body>
</html>
